<!doctype html>
<html lang="zh" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dsh-undo-savepoint · 局外 WebUI</title>
  <meta name="theme-color" content="#2f8f83" />
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- 崩溃横幅 -->
    <div id="crash-banner" class="crash-banner hidden" role="alert"></div>

    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">↶</span>
        <div class="brand-text">
          <div class="brand-title">dsh-undo-savepoint</div>
          <div class="brand-sub hidden-sm" id="subtitle">配置 / 插件 / 健康 快照</div>
        </div>
      </div>
      <div class="topbar-stats">
        <div class="stat"><span id="stat-total" class="stat-num">–</span><span class="stat-label" id="lbl-total">快照</span></div>
        <div class="stat"><span id="stat-profile" class="stat-num stat-num-sm">–</span><span class="stat-label">Profile</span></div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btn-lang" title="语言">🌐</button>
        <button class="btn btn-ghost" id="btn-refresh" title="刷新">⟳</button>
        <button class="btn btn-primary" id="btn-snapshot">＋ 快照</button>
      </div>
    </header>

    <!-- 主操作区 -->
    <main class="main">
      <section class="action-strip">
        <button class="btn btn-danger" id="btn-undo">↩ 撤销</button>
        <button class="btn btn-success" id="btn-redo">↪ 重做</button>
        <div class="spacer"></div>
        <button class="btn" id="btn-safemode">🛡 安全模式</button>
        <button class="btn" id="btn-doctor">🔍 诊断</button>
        <button class="btn" id="btn-prune">🧹 清理</button>
        <button class="btn" id="btn-export">⬇ 导出</button>
        <button class="btn" id="btn-import">⬆ 导入</button>
        <button class="btn" id="btn-message">💬 对话撤回</button>
        <button class="btn" id="btn-settings">⚙ 设置</button>
      </section>

      <section class="timeline" id="timeline">
        <div class="timeline-loading" id="timeline-loading">加载中…</div>
      </section>
    </main>

    <!-- 详情/操作提示 -->
    <div id="toast" class="toast hidden"></div>

    <!-- 弹出层：diff / 设置 / 确认 -->
    <div id="overlay" class="overlay hidden">
      <div class="panel" id="panel"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
